name: Release

# 推版本 tag（形如 5.0.0 / 3.0.10）即自动跑测试、出 fat jar 并建 GitHub Release。
# 另外支持在 Actions 页面手动运行并填一个已存在的 tag，用于补发历史版本（tag 的代码里
# 没有本文件，所以手动运行走的是默认分支上的这份定义，checkout 用输入的那个 tag）。
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在 tag，例如 5.0.0'
        required: true
        type: string
      checkout:
        description: '可选：从哪个 ref 构建，默认就是上面的 tag。只用于补发那些 tree 里还没有当前发布配置的老 tag。'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CHECKOUT: ${{ inputs.checkout || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT }}

      - name: Set up OpenJDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 停在 v5：v6 起 setup-gradle 的缓存组件 gradle-actions-caching 变成商业授权组件
      # （gradle.com/legal/terms-of-use），升级等于替本仓库接受那份条款，故不升。
      # cache-cleanup 关掉：清理步骤用 runner 自带的 Gradle（9.x，要求 JVM 17+）跑，
      # 而本仓库在 JVM 11 上构建，必然报 "Gradle requires JVM 17 or later"；不清理只是
      # 让缓存里留着旧条目，GitHub 会在 7 天后回收未被使用的缓存。
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      # tag 与 build.gradle 的 version 不一致就停在测试之前，避免发布出对不上号的 jar。
      - name: Check that the tag matches build.gradle
        run: |
          declared=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          echo "tag=$TAG build.gradle=$declared"
          test "$TAG" = "$declared"

      - name: Test
        run: ./gradlew test

      - name: Build the fat jars
        run: ./gradlew :smali:fatJar :baksmali:fatJar

      # fat jar 名字里的版本来自 build.gradle，这里确认它真的打进 jar 并能在 --version 里读出来。
      - name: Smoke test the jars
        run: |
          for jar in smali/build/libs/smali-*-fat.jar baksmali/build/libs/baksmali-*-fat.jar; do
            java -jar "$jar" --version | head -1 | grep -F " $TAG ("
          done

      # Maven Central（Sonatype 的 Portal OSSRH Staging API，maven-publish 直接 PUT）。
      # 放在 GitHub Packages 之前：补发已存在的版本时那边可能因版本重复而失败，Central 这边不该被拖累。
      # 凭据与签名私钥全部来自仓库 secrets（centralUser/centralToken 只用于本地临时发布，不进 CI）。
      # continue-on-error：Central 的版本不可变，重跑已发布过的 tag 时这一步必然报“版本已存在”；
      # 那不该中断后面的 GitHub release 附件更新。真正的发布失败由下面的可见性检查兜住。
      - name: Publish to Maven Central
        continue-on-error: true
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$CENTRAL_TOKEN" || { echo "::error::缺少 CENTRAL_TOKEN secret"; exit 1; }
          ./gradlew publish \
            -PcentralUser="$CENTRAL_USER" -PcentralToken="$CENTRAL_TOKEN" \
            -PsigningKey="$SIGNING_KEY" -PsigningPassword="$SIGNING_PASSWORD"

      # 上传到 OSSRH Staging API 之后，必须再调一次 /manual/upload 才会转到 Central Publisher Portal，
      # 而且这个调用必须和上传来自同一个 IP（所以放在同一个 job 里）。publishing_type=automatic
      # 让它在校验通过后自动 release 到 Maven Central。
      - name: Release the deployment on the Central Portal
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$CENTRAL_USER" "$CENTRAL_TOKEN" | base64 -w0)
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $auth" \
            'https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.shakarover?publishing_type=automatic'

      # release 之后 repo1.maven.org 是异步同步的（通常几分钟，偶尔更久），这里带重试地匿名拉一次，
      # 既是“消费者不需要任何凭据就能拿到”的验证，也是上面两步 continue-on-error 之后的真正门禁：
      # 超时说明这次发布没成功（或者慢得离谱），按失败处理。
      - name: Wait for the artifacts to appear on Maven Central
        run: |
          url="https://repo1.maven.org/maven2/io/github/shakarover/ksmali/smali/$TAG/smali-$TAG.pom"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$url"; then
              echo "available: $url"
              exit 0
            fi
            echo "waiting for $url ($i/30)"
            sleep 60
          done
          echo "::error::$url 30 分钟内仍未出现，发布可能失败"
          exit 1

      # 凭据用 -P 项目属性传，而不是只靠环境变量：项目属性属于本次 Gradle 调用，不受 daemon 复用
      # 影响（daemon 里 System.getenv 读到的是它启动时的环境），也不依赖 job 级 env 的写法。
      # continue-on-error：重跑已发布过的 tag 时，GitHub Packages 会因为版本已存在而失败（Central
      # 那边不可变版本也会拒绝重复发布，但它排在前面，不受影响）。这里不该因此中断后续步骤
      # —— 真正的发布失败仍会被下面的 “Check that the published artifacts resolve” 抓住。
      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew publish -Pgpr.user="$GITHUB_ACTOR" -Pgpr.key="$GITHUB_TOKEN"

      # 上传成功不等于能消费：另起一个一次性项目，从 GitHub Packages 把刚发布的构件拉下来，
      # 连传递依赖一起解析后真的跑一次 --version。
      - name: Check that the published artifacts resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          proj="$RUNNER_TEMP/consumer"
          mkdir -p "$proj"
          cat > "$proj/settings.gradle" <<'EOF'
          rootProject.name = 'consumer'
          EOF
          cat > "$proj/build.gradle" <<EOF
          plugins { id 'java' }
          repositories {
              maven {
                  url = 'https://maven.pkg.github.com/ShakaRover/ksmali'
                  credentials {
                      username = providers.gradleProperty('gpr.user').get()
                      password = providers.gradleProperty('gpr.key').get()
                  }
              }
              mavenCentral()
          }
          dependencies { implementation 'io.github.shakarover.ksmali:smali-baksmali:$TAG' }
          tasks.register('runIt', JavaExec) {
              classpath = configurations.runtimeClasspath
              mainClass = 'com.android.tools.smali.baksmali.Main'
              args '--version'
          }
          EOF
          ./gradlew -p "$proj" runIt -Pgpr.user="$GITHUB_ACTOR" -Pgpr.key="$GITHUB_TOKEN"

      # 已经发过的 tag 重跑（补发、或改完 workflow 再验证）不应该失败，改为覆盖附件。
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=(smali/build/libs/smali-*-fat.jar baksmali/build/libs/baksmali-*-fat.jar)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${jars[@]}"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "${jars[@]}"
          fi
