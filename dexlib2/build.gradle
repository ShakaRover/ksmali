import java.security.MessageDigest
import java.util.UUID

private static UUID uuid5(UUID namespace, String name) {
    MessageDigest md = MessageDigest.getInstance("SHA-1")
    md.update(uuidToBytes(namespace))
    md.update(name.getBytes())
    byte[] sha1Bytes = md.digest()
    // Set version 5 (upper 4 bits of octet 6)
    sha1Bytes[6] = (byte)((sha1Bytes[6] & 0x0f) | 0x50)
    // Set two upper bits of octet 8 to 10
    sha1Bytes[8] = (byte)((sha1Bytes[8] & 0x3f) | 0x80)
    return uuidFromBytes(sha1Bytes)
}

private static UUID uuidFromBytes(byte[] data) {
    assert data.length >= 16
    return new UUID(toNetworkOrder(data, 0), toNetworkOrder(data, 8))
}

private static byte[] uuidToBytes(UUID uuid) {
    byte[] result = new byte[16]
    fromNetworkByteOrder(uuid.getMostSignificantBits(), result, 0)
    fromNetworkByteOrder(uuid.getLeastSignificantBits(), result, 8)
    return result
}

private static long toNetworkOrder(byte[] data, int dataIndex) {
    long result = 0
    for (int i = 0; i < 8; i++) {
        result = (result << 8) | (data[dataIndex + i] & 0xff)
    }
    return result
}

private static void fromNetworkByteOrder(long value, byte[] dest, int destIndex) {
    for (int i = 0; i < 8; i++) {
        dest[destIndex + i] = (byte)((value >> ((7 - i) * 8)) & 0xff)
    }
}

plugins {
  id("org.spdx.sbom") version "0.8.0"
}

ext.testAccessorOutputDir = file("${layout.buildDirectory.get().asFile}/generated-src/accessorTest/java")
ext.testAccessorOutputFile = file("${testAccessorOutputDir}/com/android/tools/smali/dexlib2/AccessorTypes.java")

sourceSets {
    main {
        java {
            srcDirs "${project.rootDir}/third_party/dexlib2/src/main/java"
        }
    }
    accessorTest {
        java {
            srcDir testAccessorOutputDir
        }
    }
}

configurations {
    accessorTestGenerator
}

dependencies {
    implementation libs.findbugs

    testImplementation libs.junit
    testImplementation libs.mockito

    accessorTestGenerator project('accessorTestGenerator')
}

// NOTE: SyntheticAccessorFSM is now maintained by hand in
// src/main/kotlin/com/android/tools/smali/dexlib2/util/SyntheticAccessorFSM.kt.
// The ragel task that used to regenerate src/main/java/.../SyntheticAccessorFSM.java
// has been removed so that the build no longer emits Java sources into the source tree.
// SyntheticAccessorFSM.rl is kept as the reference definition of the state machine; if
// it ever changes, port the change into the Kotlin implementation by hand.

task generateAccessorTestSource(type: JavaExec) {
    outputs.dir file(testAccessorOutputDir)

    classpath = configurations.accessorTestGenerator
    mainClass = 'com.android.tools.smali.dexlib2.AccessorTestGenerator'
    args testAccessorOutputFile

    // Create the output directory at execution time: doing it during configuration
    // breaks `clean generateAccessorTestSource` in a single invocation.
    doFirst {
        file(testAccessorOutputFile.parent).mkdirs()
    }
}
compileAccessorTestJava.dependsOn(generateAccessorTestSource)
compileAccessorTestKotlin.dependsOn(generateAccessorTestSource)

// NOTE: The old generateAccessorTestDex task (which shelled out to
// com.google.android.tools:dx:1.7) has been removed. It was only ever a manual
// regeneration helper and was not part of the `test` task graph (verified with
// `./gradlew :dexlib2:test --dry-run`). It had also gone stale: the committed
// src/test/resources/accessorTest.dex still uses the upstream `org.jf.dexlib2`
// package that AccessorTest looks for, while AccessorTest.stg now emits
// `com.android.tools.smali.dexlib2`, and Android's d8 does not accept dx's CLI
// or reproduce its synthetic accessors. Regenerating it is therefore not
// possible with the current tooling; the committed dex is the source of truth.

publish {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                pom {
                    description = 'dexlib2 is a library for reading/modifying/writing Android dex files'
                    scm {
                        url = 'https://github.com/ShakaRover/ksmali/tree/main/dexlib2'
                    }
                }
            }
        }
    }
}

spdxSbom {
    targets {
        // create a target named "release",
        // this is used for the task name (spdxSbomForRelease)
        // and output file (release.spdx.json)
        create("release") {
            scm {
                uri.set("https://github.com/ShakaRover/ksmali")
                revision.set(project.version)
            }
            document {
                name.set("dexlib2 library")
                // Generate version 5 UUID from fixed namespace UUID and name generated from revision
                // (git hash) and artifact name.
                namespace.set(
                    "https://spdx.google/" + uuid5(UUID.fromString("21043d46-f605-42c1-bc56-e407d40afeff"),
                    project.version + "-dexlib2"))
                creator.set("Organization: Google LLC")
                packageSupplier.set("Organization: Google LLC")
            }
        }
    }
}
