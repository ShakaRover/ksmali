apply plugin: 'antlr'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath libs.proguard.gradle
    }
}

configurations {
    // Remove the full antlr tool that's added by the antlr plugin. We manually
    // add the smaller antlr4 runtime library instead
    implementation.exclude group: 'org.antlr', module: 'antlr4'
}

sourceSets {
    main {
        java {
            srcDirs "${project.rootDir}/third_party/smali/src/main/java"
        }
        resources {
            // This adds the generated .tokens files to the jar. The .interp files are excluded
            // because they are large and break the groovy template expansion below.
            srcDir 'build/generated-src/antlr/main'
            exclude '**/*.interp'
        }
    }
    test {
        java {
            srcDirs "${project.rootDir}/third_party/smali/src/test/java"
        }
    }
}

// The Kotlin sources reference the ANTLR-generated Java parser/lexer/tree-walker, so make the
// generated-source tasks explicit inputs of the Kotlin compilation tasks.
tasks.named('compileKotlin') { dependsOn 'generateGrammarSource' }
tasks.named('compileTestKotlin') { dependsOn 'generateTestGrammarSource' }

idea {
    module {
        excludeDirs -= buildDir
        if (buildDir.exists()) {
            excludeDirs.addAll(buildDir.listFiles())
        }
        for (sourceDir in (sourceDirs + testSourceDirs)) {
            excludeDirs.remove(sourceDir);
            while ((sourceDir = sourceDir.getParentFile()) != null) {
                excludeDirs.remove(sourceDir);
            }
        }
    }
}

dependencies {
    implementation project(':util')
    api project(':dexlib2')
    implementation libs.antlr.runtime
    implementation libs.jcommander
    implementation libs.coroutines

    testImplementation libs.junit

    antlr libs.antlr
}

processResources.inputs.property('version', version)
processResources.expand('version': version)
processResources.dependsOn('generateGrammarSource')

// Build a separate jar that contains all dependencies
task fatJar(type: Jar, dependsOn: jar) {
    dependsOn ':dexlib2:jar'
    dependsOn ':util:jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    duplicatesStrategy = 'exclude'
    archiveClassifier = 'fat'

    manifest {
        attributes('Main-Class': 'com.android.tools.smali.smali.Main')
    }

    doLast {
        if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
            ant.symlink(link: file("${destinationDirectory.get()}/smali.jar"), resource: archivePath, overwrite: true)
        }
    }
}
tasks.getByPath('build').dependsOn(fatJar)

generateTestGrammarSource {
    outputDirectory = new File(outputDirectory, 'com/android/tools/smali/smali')
    arguments = ['-no-listener', '-no-visitor']
}

generateGrammarSource {
    outputDirectory = new File(outputDirectory, 'com/android/tools/smali/smali')
    arguments = ['-no-listener', '-no-visitor']
}

publish {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                pom {
                    description = 'smali is an assembler for dalvik bytecode'
                    scm {
                        url = 'https://github.com/google/smali/tree/master/smali'
                    }
                }
            }
        }
    }
}

task proguard(type: proguard.gradle.ProGuardTask, dependsOn: fatJar) {
    def outFile = fatJar.destinationDirectory.file(
            "${fatJar.archiveBaseName.get()}-${fatJar.archiveVersion.get()}-small.${fatJar.archiveExtension.get()}")

    injars fatJar
    outjars outFile

    if (JavaVersion.current().isJava9Compatible()) {
        libraryjars(System.getProperty("java.home") + "/jmods")
    } else {
        libraryjars(System.getProperty("java.home") + "/lib/rt.jar")
    }

    dontobfuscate
    dontoptimize

    // Optional annotations referenced by kotlinx-coroutines that are not on the
    // runtime classpath; ProGuard aborts on these unresolved references unless told
    // to ignore them.
    dontwarn 'org.codehaus.mojo.animal_sniffer.**'
    dontwarn 'android.annotation.**'

    keep 'public class com.android.tools.smali.smali.Main { public static void main(java.lang.String[]); }'
    keep 'class com.beust.jcommander.** { *; }'
    keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
sourcesJar.dependsOn('generateGrammarSource')

tasks.getByPath(':release').dependsOn(proguard)
