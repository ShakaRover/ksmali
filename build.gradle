apply plugin: 'idea'

version = '5.0.0'

// 空壳任务：本仓库不再支持本地发布——发布只走 GitHub 的自动发布（.github/workflows/release.yml）。
// 保留它是因为 README 里仍用 `./gradlew release publishToMavenLocal` 跑本地 maven 仓库测试。
task release() {
}

task(install).doLast {
    println "Installing version: ${version}"
}

// The projects that get pushed to maven
def maven_release_projects = ['smali', 'baksmali', 'dexlib2', 'util']

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    // Compile against the Java 8 API, not merely to 1.8 bytecode. Without -Xjdk-release, calls to
    // methods that gained a covariant override in JDK 9+ (ByteBuffer.clear()/flip()/position(),
    // CharSequence.isEmpty(), ...) are linked against the build JDK's descriptor and fail with
    // NoSuchMethodError when the result runs on a Java 8 JVM.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '1.8'
            freeCompilerArgs += ['-Xjdk-release=1.8']
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(8)
    }

    // Sources also live under third_party/<module>/; keep Kotlin files there in the source set too
    sourceSets {
        main {
            kotlin.srcDir "${project.rootDir}/third_party/${project.name}/src/main/kotlin"
        }
        test {
            kotlin.srcDir "${project.rootDir}/third_party/${project.name}/src/test/kotlin"
        }
    }

    if (JavaVersion.current().isJava8Compatible()) {
        allprojects {
            tasks.withType(Javadoc) {
                options.addStringOption('Xdoclint:none', '-quiet')
            }
        }
    }

    version = parent.version

    java {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    jar {
        from(project.rootDir) {
            include 'LICENSE'
        }
    }

    repositories {
        mavenCentral()
    }

    if (project.name in maven_release_projects) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        // 本 fork 自己的坐标。上游 google/smali 的 com.android.tools.smali 是 Google 的命名空间，
        // 第三方无法在 Maven Central 证明归属，故不能沿用。
        group = 'io.github.shakarover.ksmali'
        def artifact = project.name
        if (artifact != 'smali') {
            artifact = 'smali-' + artifact
        }

        // 发布目标：Maven Central（走 Sonatype 的 Portal OSSRH Staging API，与 maven-publish 兼容）。
        // 只在 GitHub Actions 里注册：发布只支持 GitHub 的自动发布（release workflow），本机跑
        // ./gradlew publish / release 都不会碰远端仓库。凭据在 CI 里由 -PcentralUser/-PcentralToken
        // （或 CENTRAL_USER/CENTRAL_TOKEN）注入。
        def inGitHubActions = System.getenv('GITHUB_ACTIONS') == 'true'
        def centralUser = project.findProperty('centralUser') ?: System.getenv('CENTRAL_USER')
        def centralToken = project.findProperty('centralToken') ?: System.getenv('CENTRAL_TOKEN')

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = artifact
                    from components.java
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }

                    pom {
                        name = project.name
                        url = 'https://github.com/ShakaRover/ksmali'

                        licenses {
                            license {
                                name = 'The BSD 3-Clause License'
                                url = 'http://opensource.org/licenses/BSD-3-Clause'
                                distribution = 'repo'
                            }
                        }
                        scm {
                            connection = 'scm:git:git://github.com/ShakaRover/ksmali.git'
                            developerConnection = 'scm:git:git@github.com:ShakaRover/ksmali.git'
                        }
                        developers {
                            developer {
                                id = 'jesusfreke'
                                name = 'Ben Gruver'
                                email = 'jesusfreke@jesusfreke.com'
                            }
                            developer {
                                name = 'The Android Open Source Project'
                            }
                        }
                    }
                }
            }
            if (inGitHubActions && centralUser && centralToken) {
                repositories {
                    maven {
                        // Sonatype 的 Portal OSSRH Staging API：maven-publish 直接 PUT 到这里，
                        // 之后还要调 POST /manual/upload/defaultRepository/<namespace> 才会
                        // 出现在 Central Publisher Portal（见 README）。
                        name = 'CentralPortal'
                        url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
                        credentials {
                            username = centralUser
                            password = centralToken
                        }
                    }
                }
            }
        }

        // Maven Central 强制要求 GPG 签名。密钥可以来自 -PsigningKey（ASCII armored 私钥内容，
        // CI 里从 secret 注入，走 useInMemoryPgpKeys）或传统的 signing.secretKeyRingFile
        // （文件式密钥环，~/.gradle/gradle.properties 里配 signing.*）；两者都没有时跳过签名，
        // 这样只跑 publishToMavenLocal（本机 publish 不注册远端仓库，等于空跑）不会因为缺密钥失败。
        def signingKey = project.findProperty('signingKey')
        def signingPassword = project.findProperty('signingPassword')
        def signingConfigured = (signingKey != null) || project.hasProperty('signing.secretKeyRingFile')
        signing {
            if (signingKey != null) {
                useInMemoryPgpKeys(signingKey, signingPassword ?: '')
            }
            required { gradle.taskGraph.hasTask('publish') && signingConfigured }
            sign(publishing.publications["mavenJava"])
        }

        java {
            withJavadocJar()
            withSourcesJar()
        }
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath libs.jgit
        classpath libs.kotlin.gradle.plugin
    }
}

wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.ALL
}
