apply plugin: 'idea'

version = '5.0.0'

// Note: please don't use this. This is strictly for the official releases
// that are posted on, e.g. the bitbucket download page.
task release() {
}

task(install).doLast {
    println "Installing version: ${version}"
}

// The projects that get pushed to maven
def maven_release_projects = ['smali', 'baksmali', 'dexlib2', 'util']

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    // Compile against the Java 8 API, not merely to 1.8 bytecode. Without -Xjdk-release, calls to
    // methods that gained a covariant override in JDK 9+ (ByteBuffer.clear()/flip()/position(),
    // CharSequence.isEmpty(), ...) are linked against the build JDK's descriptor and fail with
    // NoSuchMethodError when the result runs on a Java 8 JVM.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '1.8'
            freeCompilerArgs += ['-Xjdk-release=1.8']
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release.set(8)
    }

    // Sources also live under third_party/<module>/; keep Kotlin files there in the source set too
    sourceSets {
        main {
            kotlin.srcDir "${project.rootDir}/third_party/${project.name}/src/main/kotlin"
        }
        test {
            kotlin.srcDir "${project.rootDir}/third_party/${project.name}/src/test/kotlin"
        }
    }

    if (JavaVersion.current().isJava8Compatible()) {
        allprojects {
            tasks.withType(Javadoc) {
                options.addStringOption('Xdoclint:none', '-quiet')
            }
        }
    }

    version = parent.version

    java {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    jar {
        from(project.rootDir) {
            include 'LICENSE'
        }
    }

    repositories {
        mavenCentral()
    }

    if (project.name in maven_release_projects) {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        // 本 fork 自己的坐标。上游 google/smali 的 com.android.tools.smali 是 Google 的命名空间，
        // 第三方无法在 Maven Central 证明归属，故不能沿用。
        group = 'io.github.shakarover.ksmali'
        def artifact = project.name
        if (artifact != 'smali') {
            artifact = 'smali-' + artifact
        }

        // 发布目标：GitHub Packages。凭据来自 -Pgpr.user/-Pgpr.key，或 CI 里的
        // GITHUB_ACTOR/GITHUB_TOKEN；没有凭据时不注册仓库，publish 就是空跑（publishToMavenLocal
        // 本来也不碰它），这样本地 `./gradlew release publishToMavenLocal` 不会因为缺凭据失败。
        def ghUser = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
        def ghToken = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = artifact
                    from components.java
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }

                    pom {
                        name = project.name
                        url = 'https://github.com/ShakaRover/ksmali'

                        licenses {
                            license {
                                name = 'The BSD 3-Clause License'
                                url = 'http://opensource.org/licenses/BSD-3-Clause'
                                distribution = 'repo'
                            }
                        }
                        scm {
                            connection = 'scm:git:git://github.com/ShakaRover/ksmali.git'
                            developerConnection = 'scm:git:git@github.com:ShakaRover/ksmali.git'
                        }
                        developers {
                            developer {
                                id = 'jesusfreke'
                                name = 'Ben Gruver'
                                email = 'jesusfreke@jesusfreke.com'
                            }
                            developer {
                                name = 'The Android Open Source Project'
                            }
                        }
                    }
                }
            }
            if (ghUser && ghToken) {
                repositories {
                    maven {
                        name = 'GitHubPackages'
                        url = uri('https://maven.pkg.github.com/ShakaRover/ksmali')
                        credentials {
                            username = ghUser
                            password = ghToken
                        }
                    }
                }
            }
        }

        // GitHub Packages 不要求 GPG 签名，所以只有真的配了密钥（-PsigningKey/-PsigningPassword，
        // 或 ~/.gradle/gradle.properties 里的 signing.*）时才把签名设为必需；缺密钥时跳过签名而不是
        // 让 publish 直接失败。将来要发 Maven Central（强制签名）时，配好密钥即恢复强制。
        def signingConfigured = project.hasProperty('signingKey') ||
                project.hasProperty('signing.secretKeyRingFile')
        signing {
            required { gradle.taskGraph.hasTask('publish') && signingConfigured }
            sign(publishing.publications["mavenJava"])
        }

        java {
            withJavadocJar()
            withSourcesJar()
        }

        tasks.getByPath(':release').dependsOn(publish)
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath libs.jgit
        classpath libs.kotlin.gradle.plugin
    }
}

wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.ALL
}
